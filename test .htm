<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ডায়নামিক আইপিটিভি প্লেয়ার</title>
  
  <!-- Video.js CSS (সঠিক CDN লিঙ্ক) -->
  <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
  
  <style>
    body {
      background-color: #11141a;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .main-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: row;
      gap: 20px;
      background: #1b1f27;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .player-section {
      flex: 2;
    }
    .video-js {
      width: 100% !important;
      height: 450px !important;
      border-radius: 8px;
      overflow: hidden;
    }
    .sidebar-section {
      flex: 1;
      background: #14171e;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      height: 450px; /* প্লেয়ারের সমান উচ্চতা */
    }
    .sidebar-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 5px;
      color: #007bff;
    }
    .channel-list {
      flex-grow: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 5px;
    }
    /* স্ক্রোলবার ডিজাইন */
    .channel-list::-webkit-scrollbar {
      width: 6px;
    }
    .channel-list::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }
    /* চ্যানেল আইটেম ডিজাইন */
    .channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1f2430;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .channel-item:hover {
      background: #2a3142;
      border-color: #007bff;
    }
    .channel-item.active {
      background: #007bff;
      color: #fff;
    }
    .channel-icon {
      width: 30px;
      height: 30px;
      background: #333;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      flex-shrink: 0;
    }
    .channel-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #loading-msg {
      text-align: center;
      color: #aaa;
      margin-top: 20px;
    }

    /* মোবাইল রেসপনসিভ */
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }
      .video-js {
        height: 250px !important;
      }
      .sidebar-section {
        height: 300px;
      }
    }
  </style>
</head>
<body>

<div class="main-container">
  
  <!-- ভিডিও প্লেয়ার -->
  <div class="player-section">
    <video id="tv-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" data-setup="{}">
      <p class="vjs-no-js">To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video</p>
    </video>
  </div>

  <!-- চ্যানেল লিস্ট -->
  <div class="sidebar-section">
    <div class="sidebar-title">লাইভ চ্যানেল</div>
    <div class="channel-list" id="channel-list">
      <div id="loading-msg">চ্যানেল লোড হচ্ছে...</div>
    </div>
  </div>

</div>

<!-- Video.js JS (সঠিক CDN লিঙ্ক) -->
<script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>

<script>
  // ১. প্লেয়ার সেটআপ
  var player = videojs('tv-player');

  // ২. আপনার M3U লিঙ্ক
  const m3uUrl = "https://raw.githubusercontent.com/Rakib49/Rakibiptv/refs/heads/main/aynaott.m3u";

  // ৩. M3U ফাইল থেকে ডাটা আনার ফাংশন
  async function fetchChannels() {
    try {
      const response = await fetch(m3uUrl);
      if (!response.ok) throw new Error("Network response was not ok");
      const data = await response.text();
      parseM3U(data);
    } catch (error) {
      console.error("Error loading playlist:", error);
      document.getElementById('loading-msg').innerText = "চ্যানেল লোড করা যায়নি। দয়া করে ইন্টারনেট কানেকশন চেক করুন।";
    }
  }

  // ৪. M3U টেক্সট পার্স (Parse) করার ফাংশন
  function parseM3U(m3uText) {
    const lines = m3uText.split('\n');
    const container = document.getElementById('channel-list');
    container.innerHTML = ""; // লোডিং মেসেজ ডিলিট

    let currentName = "";
    let channelCount = 0;

    lines.forEach((line) => {
      line = line.trim();
      
      // লাইনে যদি নাম থাকে (#EXTINF)
      if (line.startsWith('#EXTINF:')) {
        // নামের শেষের অংশটুকু নেওয়া (কমার পরে)
        let parts = line.split(',');
        currentName = parts[parts.length - 1] || "অজানা চ্যানেল";
      }
      // লাইনে যদি লিঙ্ক থাকে (http)
      else if (line.startsWith('http')) {
        channelCount++;
        createChannelItem(channelCount, currentName, line, container);
        
        // প্রথম চ্যানেলটি অটোমেটিক লোড করা
        if (channelCount === 1) {
          playStream(line);
          // প্রথম আইটেমকে একটিভ দেখানো হবে একটু পরে (DOM তৈরির পর)
          setTimeout(() => {
            const firstItem = container.querySelector('.channel-item');
            if(firstItem) firstItem.classList.add('active');
          }, 100);
        }
      }
    });

    if (channelCount === 0) {
      container.innerHTML = '<div style="text-align:center; padding:10px;">কোনো চ্যানেল পাওয়া যায়নি</div>';
    }
  }

  // ৫. লিস্ট আইটেম তৈরি করা
  function createChannelItem(index, name, url, container) {
    const div = document.createElement('div');
    div.className = 'channel-item';
    div.innerHTML = `
      <div class="channel-icon">${index}</div>
      <div class="channel-name">${name}</div>
    `;
    
    // ক্লিক করলে প্লে হবে
    div.addEventListener('click', function() {
      // আগের একটিভ ক্লাস সরানো
      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      // বর্তমানটাতে ক্লাস যুক্ত করা
      div.classList.add('active');
      
      playStream(url);
    });

    container.appendChild(div);
  }

  // ৬. ভিডিও প্লে করার ফাংশন
  function playStream(url) {
    player.src({
      src: url,
      type: 'application/x-mpegURL'
    });
    player.play().catch(e => console.log("Auto-play prevented by browser"));
  }

  // স্ক্রিপ্ট রান করা
  fetchChannels();

</script>

</body>
</html>
